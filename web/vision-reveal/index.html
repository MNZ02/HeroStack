<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Saiyan Studio — Power Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0B0B0F;
  --bg-elevated: #14141A;
  --ink: #F5F0E6;
  --ink-muted: #A89B88;
  --orange: #FF6A00;
  --orange-deep: #E04E00;
  --gold: #FFD24A;
  --gold-soft: #F5C542;
  --blue: #1B6BFF;
  --blue-deep: #0D47C9;
  --ki: #75C5DE;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* ===== SPLASH — ki energy panels ===== */
.splash {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  z-index: 9999;
  pointer-events: none;
  overflow: hidden;
  animation: splashHide 0.3s ease forwards;
  animation-delay: 1.35s;
}
.splash-row { display: flex; width: 100%; height: 50%; }
.splash-box { width: 20%; height: 100%; background: var(--orange); }
.splash-box:nth-child(even) { background: var(--gold); }
.splash-row-bottom .splash-box:nth-child(odd) { background: var(--blue); }
.splash-row-bottom .splash-box:nth-child(even) { background: var(--orange-deep); }
.splash-row-top .splash-box { animation: splashTop 1s cubic-bezier(0.96,-0.02,0.38,1.01) forwards; }
.splash-row-bottom .splash-box { animation: splashBottom 1s cubic-bezier(0.96,-0.02,0.38,1.01) forwards; }
.splash-box:nth-child(1) { animation-delay: 0s; }
.splash-box:nth-child(2) { animation-delay: 0.05s; }
.splash-box:nth-child(3) { animation-delay: 0.1s; }
.splash-box:nth-child(4) { animation-delay: 0.15s; }
.splash-box:nth-child(5) { animation-delay: 0.2s; }

@keyframes splashTop { from { transform: translateY(0%); } to { transform: translateY(-100%); } }
@keyframes splashBottom { from { transform: translateY(0%); } to { transform: translateY(100%); } }
@keyframes splashHide { to { opacity: 0; visibility: hidden; } }

/* ===== HERO IMAGE ENTRANCE ===== */
@keyframes heroImageIn {
  from { opacity: 0; transform: scale(1.5) rotate(3deg); }
  to { opacity: 1; transform: scale(1) rotate(0deg); }
}
.hero-image-animate {
  animation: heroImageIn 1.2s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  animation-delay: 1s;
  opacity: 0;
}

/* ===== WORD REVEAL ===== */
@keyframes wordReveal {
  from { opacity: 0; transform: translateY(10px); filter: blur(10px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.word-reveal {
  opacity: 0;
  display: inline-block;
  margin-right: 0.3em;
  animation: wordReveal 0.4s ease forwards;
}

/* ===== CTA ENTRANCE ===== */
@keyframes slideUpScale {
  from { opacity: 0; transform: translateY(60px) scale(0.4); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.cta-animate {
  opacity: 0;
  animation: slideUpScale 0.8s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  animation-delay: 1s;
}

/* ===== CTA BUTTON ===== */
.cta-btn {
  position: relative; overflow: hidden; display: flex; align-items: center;
  border: none; background: none; cursor: pointer; border-radius: 9999px; padding: 8px; gap: 12px;
}
.cta-btn-bg {
  position: absolute; top: 5px; bottom: 5px; left: 8px;
  width: calc(100% - 8px - 8px - 48px - 12px);
  border-radius: 9999px; background: var(--ink); z-index: 0;
  transition: width 0.4s cubic-bezier(0.25,0.46,0.45,0.94), background 0.3s ease;
}
@media (min-width: 768px) { .cta-btn-bg { width: calc(100% - 8px - 8px - 54px - 12px); } }
.cta-btn:hover .cta-btn-bg { width: calc(100% - 16px); background: var(--gold); }
.cta-btn-text {
  position: relative; z-index: 1; color: #111111; font-weight: 600; font-size: 16px;
  padding: 12px 32px; white-space: nowrap; letter-spacing: 0.01em;
}
@media (min-width: 768px) { .cta-btn-text { font-size: 18px; padding: 16px 40px; } }
.cta-btn-circle {
  position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 50%; background: var(--orange); flex-shrink: 0;
  box-shadow: 0 0 24px rgba(255, 106, 0, 0.45);
  transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94), background 0.3s ease, box-shadow 0.3s ease;
}
@media (min-width: 768px) { .cta-btn-circle { width: 54px; height: 54px; } }
.cta-btn:hover .cta-btn-circle {
  transform: translateX(-7px);
  background: var(--blue);
  box-shadow: 0 0 28px rgba(27, 107, 255, 0.5);
}

/* ===== MENU CTA ===== */
.menu-cta-btn {
  position: relative; overflow: hidden; display: flex; align-items: center;
  border: none; background: none; cursor: pointer; border-radius: 9999px; padding: 6px; gap: 8px;
}
.menu-cta-bg {
  position: absolute; top: 5px; bottom: 5px; left: 8px;
  width: calc(100% - 8px - 8px - 38px - 8px);
  border-radius: 9999px; background: var(--ink); z-index: 0;
  transition: width 0.4s cubic-bezier(0.25,0.46,0.45,0.94), background 0.3s ease;
}
.menu-cta-btn:hover .menu-cta-bg { width: calc(100% - 12px); background: var(--gold); }
.menu-cta-text { position: relative; z-index: 1; color: #111111; font-weight: 600; font-size: 14px; padding: 8px 40px; white-space: nowrap; }
.menu-cta-circle {
  position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 50%; background: var(--orange); flex-shrink: 0;
  transition: transform 0.3s ease, background 0.3s ease;
}
.menu-cta-btn:hover .menu-cta-circle { transform: translateX(-4px); background: var(--blue); }

/* ===== CREATOR TEXT ===== */
@keyframes creatorSlideUp { from { transform: translateY(330px); } to { transform: translateY(0); } }
.creator-text-animate {
  transform: translateY(330px);
  animation: creatorSlideUp 1s cubic-bezier(0.16,1,0.3,1) forwards;
  animation-delay: 1.5s;
}

/* ===== NAVIGATION ===== */
.logo-wrapper {
  position: fixed; top: 30px; left: 0; width: 50%; z-index: 10;
  display: flex; justify-content: flex-start; align-items: center;
}
@media (min-width: 768px) { .logo-wrapper { top: 40px; } }
.logo-wrapper .inner { padding-left: 20px; }
@media (min-width: 768px) { .logo-wrapper .inner { padding-left: 40px; } }
.logo-mark {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
}
.logo-glyph {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(145deg, var(--orange) 0%, var(--gold) 100%);
  display: grid; place-items: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; color: #111; box-shadow: 0 0 20px rgba(255, 106, 0, 0.35);
}
.logo-word {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 0.08em; color: var(--ink);
}
.logo-word span { color: var(--orange); }

.burger-wrapper {
  position: fixed; top: 16px; right: 0; width: 50%; z-index: 10;
  display: flex; justify-content: flex-end; align-items: center;
}
@media (min-width: 768px) { .burger-wrapper { top: 27px; } }
.burger-wrapper .inner { padding-right: 20px; }
@media (min-width: 768px) { .burger-wrapper .inner { padding-right: 40px; } }

.burger-btn {
  width: 59px; height: 59px; border-radius: 50%; border: 2px solid rgba(255,210,74,0.35); cursor: pointer;
  display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
  background: rgba(20,20,26,0.85); transition: background 0.4s ease, border-color 0.3s ease;
  backdrop-filter: blur(8px);
}
.burger-btn:hover { background: var(--orange); border-color: var(--orange); }
.burger-btn .bar {
  display: block; width: 24px; height: 2px; background: var(--gold);
  transition: all 0.3s ease;
}
.burger-btn:hover .bar { background: #111; }
.burger-btn.open { background: var(--blue); border-color: var(--blue); }
.burger-btn.open .bar { background: var(--ink); }
.burger-btn.open .bar:first-child { transform: rotate(45deg) translate(2px, 2px); }
.burger-btn.open .bar:last-child { transform: rotate(-45deg) translate(2px, -2px); }

/* ===== MENU PANEL ===== */
.menu-panel {
  position: fixed; z-index: 9;
  left: 8px; right: 8px;
  border-radius: 20px;
  background: linear-gradient(165deg, rgba(20,20,26,0.97) 0%, rgba(11,11,15,0.98) 100%);
  border: 1px solid rgba(255, 106, 0, 0.25);
  box-shadow: 0 24px 80px rgba(0,0,0,0.55), 0 0 60px rgba(255, 106, 0, 0.08);
  backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  padding: 90px 32px 32px 32px;
  display: flex; flex-direction: column; justify-content: space-between;
  transition: top 0.5s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.4s ease;
  top: -600px; opacity: 0; pointer-events: none;
}
@media (min-width: 768px) {
  .menu-panel { left: auto; right: 7px; width: 420px; padding: 60px; }
}
.menu-panel.open { top: 0; opacity: 1; pointer-events: auto; }
@media (min-width: 768px) { .menu-panel.open { top: 7px; } }

.menu-panel nav { display: flex; flex-direction: column; gap: 8px; }
.menu-panel nav a {
  color: var(--ink); font-family: 'Bebas Neue', sans-serif;
  font-size: 42px; font-weight: 400; text-decoration: none;
  line-height: 110%; letter-spacing: 0.04em; transition: color 0.3s ease, transform 0.25s ease;
}
@media (min-width: 768px) { .menu-panel nav a { font-size: 48px; } }
.menu-panel nav a:hover { color: var(--orange); transform: translateX(6px); }

.menu-contact { display: flex; flex-direction: column; gap: 20px; margin-top: 32px; }
.menu-email { color: var(--ink-muted); font-size: 18px; text-decoration: none; transition: color 0.3s ease; }
@media (min-width: 768px) { .menu-email { font-size: 20px; } }
.menu-email:hover { color: var(--gold); }
.menu-socials { display: flex; gap: 24px; flex-wrap: wrap; }
.menu-socials a {
  color: var(--ink-muted); font-size: 14px; text-decoration: underline;
  text-underline-offset: 2px; transition: color 0.3s ease;
}
.menu-socials a:hover { color: var(--orange); }

/* ===== HERO ===== */
.hero {
  position: relative; width: 100%; overflow: hidden;
  background:
    radial-gradient(ellipse 80% 60% at 70% 50%, rgba(255, 106, 0, 0.12) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(27, 107, 255, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 50% 0%, rgba(255, 210, 74, 0.08) 0%, transparent 45%),
    var(--bg);
  min-height: 100vh;
}
@media (min-width: 768px) { .hero { height: 100vh; min-height: 800px; } }

.hero-big-text {
  position: absolute; bottom: -20px; left: 0; right: 0; z-index: 2;
  pointer-events: none; width: 100%; text-align: center;
}
@media (min-width: 768px) { .hero-big-text { bottom: -30px; } }
.hero-big-text h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-weight: 400;
  color: transparent;
  background: linear-gradient(180deg, rgba(255,210,74,0.22) 0%, rgba(255,106,0,0.12) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  line-height: 80%;
  letter-spacing: 0.02em; white-space: nowrap;
  font-size: clamp(140px, 26vw, 520px);
  text-shadow: none;
  -webkit-text-stroke: 1px rgba(255, 210, 74, 0.15);
}

.hero-base-img {
  position: absolute; top: 28vh; left: 0; right: 0; bottom: 0;
  background-size: cover; background-repeat: no-repeat;
  background-position: center center; z-index: 5;
}
@media (min-width: 768px) { .hero-base-img { top: 0; } }

.hero-reveal-img {
  position: absolute; top: 28vh; left: 0; right: 0; bottom: 0;
  background-size: cover; background-repeat: no-repeat;
  background-position: center center; z-index: 7; pointer-events: none;
  /* soft gold glow under SSJ reveal */
  filter: drop-shadow(0 0 40px rgba(255, 210, 74, 0.25));
}
@media (min-width: 768px) { .hero-reveal-img { top: 0; } }

.hero-content {
  position: relative; z-index: 8;
  display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;
  width: 100%; max-width: 1600px; margin: 0 auto;
  padding: 110px 16px 24px 16px; pointer-events: none;
}
@media (min-width: 768px) {
  .hero-content {
    position: absolute; inset: 0;
    justify-content: space-between;
    padding: 160px 40px 100px 40px;
  }
}
.hero-content-inner {
  display: flex; flex-direction: column; align-items: flex-start; gap: 28px;
  width: 100%; pointer-events: auto;
}

.hero-kicker {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--gold); opacity: 0;
  animation: wordReveal 0.5s ease forwards;
  animation-delay: 0.95s;
}
.hero-kicker::before {
  content: '';
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 12px var(--orange);
}

.hero-headline {
  font-size: 22px; font-weight: 500; line-height: 125%;
  letter-spacing: -0.02em; color: var(--ink); max-width: 480px;
  text-shadow: 0 2px 24px rgba(0,0,0,0.65);
}
@media (min-width: 768px) { .hero-headline { font-size: 28px; } }

.hero-hint {
  margin-top: 4px;
  font-size: 13px; color: var(--ink-muted); letter-spacing: 0.04em;
  opacity: 0;
  animation: wordReveal 0.5s ease forwards;
  animation-delay: 1.6s;
}
.hero-hint strong { color: var(--gold); font-weight: 600; }

/* energy orbs decoration */
.ki-orb {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 3;
  filter: blur(40px); opacity: 0.35;
}
.ki-orb-1 {
  width: 220px; height: 220px; background: var(--orange);
  top: 18%; right: 12%; animation: kiPulse 4s ease-in-out infinite;
}
.ki-orb-2 {
  width: 160px; height: 160px; background: var(--blue);
  bottom: 22%; left: 8%; animation: kiPulse 5s ease-in-out infinite 1s;
}
@keyframes kiPulse {
  0%, 100% { transform: scale(1); opacity: 0.25; }
  50% { transform: scale(1.15); opacity: 0.4; }
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  .splash { animation: splashHide 0.01s linear forwards; }
  .splash-box { animation: none !important; }
  .hero-image-animate, .word-reveal, .cta-animate, .creator-text-animate, .hero-kicker, .hero-hint {
    animation: none !important; opacity: 1 !important;
    transform: none !important; filter: none !important; visibility: visible !important;
  }
  .ki-orb { animation: none !important; }
}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splash-row splash-row-top">
    <div class="splash-box"></div><div class="splash-box"></div><div class="splash-box"></div><div class="splash-box"></div><div class="splash-box"></div>
  </div>
  <div class="splash-row splash-row-bottom">
    <div class="splash-box"></div><div class="splash-box"></div><div class="splash-box"></div><div class="splash-box"></div><div class="splash-box"></div>
  </div>
</div>

<!-- LOGO -->
<div class="logo-wrapper">
  <div class="inner">
    <a href="/" class="logo-mark" aria-label="Saiyan Studio home">
      <span class="logo-glyph" aria-hidden="true">悟</span>
      <span class="logo-word">SAIYAN <span>STUDIO</span></span>
    </a>
  </div>
</div>

<!-- BURGER -->
<div class="burger-wrapper">
  <div class="inner">
    <button class="burger-btn" id="burger-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu-panel">
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</div>

<!-- MENU PANEL -->
<div class="menu-panel" id="menu-panel" role="dialog" aria-label="Main menu">
  <nav>
    <a href="#sagas">Sagas</a>
    <a href="#forms">Forms</a>
    <a href="#training">Training</a>
    <a href="#capsule">Capsule Corp</a>
  </nav>
  <div class="menu-contact">
    <a href="mailto:power@saiyan.studio" class="menu-email">power@saiyan.studio</a>
    <div class="menu-socials">
      <a href="#">Dragon Ball</a>
      <a href="#">Z Fighters</a>
      <a href="#">Hyperbolic</a>
    </div>
  </div>
  <div style="margin-top:32px;">
    <button class="menu-cta-btn" type="button">
      <span class="menu-cta-bg"></span>
      <span class="menu-cta-text">Power up</span>
      <span class="menu-cta-circle">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 13L13 5M13 5H6M13 5V12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
  </div>
</div>

<!-- HERO -->
<main class="hero">
  <div class="ki-orb ki-orb-1" aria-hidden="true"></div>
  <div class="ki-orb ki-orb-2" aria-hidden="true"></div>

  <!-- Big text behind image -->
  <div class="hero-big-text creator-text-animate">
    <h2>SAIYAN</h2>
  </div>

  <!-- Base: base form (black hair) — original with black bg blends into dark theme -->
  <div class="hero-base-img hero-image-animate"
       style="background-image:url('assets/goku-base.png?v=3');"
       role="img"
       aria-label="Goku base form">
  </div>

  <!-- Reveal: Super Saiyan -->
  <div class="hero-reveal-img" id="reveal-img"
       style="background-image:url('assets/goku-ssj.jpg?v=3');"
       role="img"
       aria-label="Goku Super Saiyan reveal">
  </div>

  <!-- Content -->
  <div class="hero-content">
    <div class="hero-content-inner">
      <p class="hero-kicker">Power level: over 9000</p>
      <h1 class="hero-headline" id="headline"></h1>
      <button class="cta-btn cta-animate" type="button">
        <span class="cta-btn-bg"></span>
        <span class="cta-btn-text">Go Super Saiyan</span>
        <span class="cta-btn-circle">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M5 13L13 5M13 5H6M13 5V12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
      <p class="hero-hint">Move your cursor to <strong>unlock the transformation</strong></p>
    </div>
  </div>
</main>

<script>
(function() {
  const headline = document.getElementById('headline');
  const text = "I train legends, craft ki-charged stories & motion that hit like a Kamehameha.";
  const words = text.split(' ');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  words.forEach(function(word, i) {
    const span = document.createElement('span');
    span.className = 'word-reveal';
    span.textContent = word;
    if (!reducedMotion) {
      span.style.animationDelay = (1 + i * 0.05) + 's';
    }
    headline.appendChild(span);
  });

  const burgerBtn = document.getElementById('burger-btn');
  const menuPanel = document.getElementById('menu-panel');
  let menuOpen = false;

  function setMenuOpen(open) {
    menuOpen = open;
    burgerBtn.classList.toggle('open', open);
    menuPanel.classList.toggle('open', open);
    burgerBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    burgerBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  burgerBtn.addEventListener('click', function() {
    setMenuOpen(!menuOpen);
  });

  menuPanel.querySelectorAll('nav a').forEach(function(a) {
    a.addEventListener('click', function() {
      setMenuOpen(false);
    });
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && menuOpen) setMenuOpen(false);
  });

  // Super Saiyan spotlight reveal
  const SPOTLIGHT_R = 280;
  const imgLayer = document.getElementById('reveal-img');
  const mouse = { x: -9999, y: -9999 };
  const smooth = { x: -9999, y: -9999 };
  let running = false;

  function setMask(x, y) {
    const rect = imgLayer.getBoundingClientRect();
    const lx = x - rect.left;
    const ly = y - rect.top;
    // warmer, slightly harder core for "ki burst" feel
    const mask = 'radial-gradient(circle ' + SPOTLIGHT_R + 'px at ' + lx + 'px ' + ly + 'px,' +
      'rgba(0,0,0,1) 0%,' +
      'rgba(0,0,0,1) 35%,' +
      'rgba(0,0,0,0.85) 55%,' +
      'rgba(0,0,0,0.45) 72%,' +
      'rgba(0,0,0,0.15) 88%,' +
      'rgba(0,0,0,0) 100%)';
    imgLayer.style.webkitMaskImage = mask;
    imgLayer.style.maskImage = mask;
    imgLayer.style.webkitMaskRepeat = 'no-repeat';
    imgLayer.style.maskRepeat = 'no-repeat';
    imgLayer.style.webkitMaskSize = '100% 100%';
    imgLayer.style.maskSize = '100% 100%';
  }

  if (reducedMotion) {
    imgLayer.style.opacity = '0';
    return;
  }

  setMask(-9999, -9999);

  window.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if (!running) {
      running = true;
      requestAnimationFrame(loop);
    }
  }, { passive: true });

  window.addEventListener('mouseleave', function() {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  window.addEventListener('touchmove', function(e) {
    if (!e.touches[0]) return;
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    if (!running) {
      running = true;
      requestAnimationFrame(loop);
    }
  }, { passive: true });

  function loop() {
    smooth.x += (mouse.x - smooth.x) * 0.12;
    smooth.y += (mouse.y - smooth.y) * 0.12;
    setMask(smooth.x, smooth.y);

    var dx = mouse.x - smooth.x;
    var dy = mouse.y - smooth.y;
    if (dx * dx + dy * dy > 0.25 || mouse.x > -9000) {
      requestAnimationFrame(loop);
    } else {
      running = false;
    }
  }
})();
</script>
</body>
</html>
